services:
  lp-route-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lp-route-api:latest
    container_name: lp-route-api
    environment:
      PORT: "8002"
    ports:
      - "8002:8002"
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
