openapi: 3.1.1
info:
  title: Support Triage AI Proposal API
  version: 0.2.1-design
  license:
    name: UNLICENSED course project
    identifier: LicenseRef-Course-Project
  description: 'Контракт AI-сервиса Lab 2. Сервис только предлагает карточку для проверки
    человеком и не содержит операций отправки ответа, назначения исполнителя или изменения
    тикета. Формат соответствует OpenAPI 3.1.1: https://spec.openapis.org/oas/v3.1.1.html'
servers:
- url: http://ai:8000
  description: Внутренняя сеть Compose
tags:
- name: system
  description: Техническое состояние сервиса
- name: analysis
  description: Подготовка AI-предложения для проверки оператором
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Process liveness; not model or KB readiness
      responses:
        '200':
          description: Сервис принимает запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /v1/analyze:
    post:
      tags:
      - analysis
      operationId: analyzeTicket
      summary: Подготовить предложение карточки для оператора
      description: 'Returns a proposal for human review. Maximum request body: 65536
        UTF-8 bytes. request_id is correlation, not idempotency. At most two model
        calls in a shared 55-second deadline. Retries may incur additional cost.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            examples:
              clarification:
                value:
                  request_id: req-20261001-001
                  ticket_ref: ticket-003
                  ticket_text: С меня списали оплату два раза за один месяц
                  history: []
                  kb_version: v1
      responses:
        '200':
          description: Предложение карточки или безопасный ручной fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
              examples:
                answer:
                  value:
                    request_id: req-example
                    status: proposed
                    mode: answer
                    category: access
                    urgency: low
                    urgency_reason: Нет признаков массового сбоя
                    summary: Клиент спрашивает о настройке 2FA
                    known_facts:
                    - Запрошен путь к включению 2FA
                    missing_data: []
                    next_step: Оператор проверяет источник и текст
                    evidence:
                    - source_id: KB-2FA-v1
                      version: v1
                      title: Настройка 2FA
                      excerpt: В настройках безопасности оператор показывает путь
                        к включению 2FA; код восстановления хранит сам пользователь.
                    draft_reply: Откройте настройки безопасности для включения 2FA.
                    needs_human_review: true
                    warnings: []
                clarify:
                  value:
                    request_id: req-example
                    status: proposed
                    mode: clarify
                    category: access
                    urgency: low
                    urgency_reason: Нет признаков массового сбоя
                    summary: Клиент спрашивает о настройке 2FA
                    known_facts:
                    - Запрошен путь к включению 2FA
                    missing_data:
                    - Error code
                    next_step: Оператор проверяет источник и текст
                    evidence: []
                    draft_reply: Which error code is displayed?
                    needs_human_review: true
                    warnings: []
                escalate:
                  value:
                    request_id: req-example
                    status: proposed
                    mode: escalate
                    category: access
                    urgency: low
                    urgency_reason: Нет признаков массового сбоя
                    summary: Клиент спрашивает о настройке 2FA
                    known_facts:
                    - Запрошен путь к включению 2FA
                    missing_data: []
                    next_step: Operator verifies permissions and selects specialist
                    evidence: []
                    draft_reply: null
                    needs_human_review: true
                    warnings: []
                manualFallback:
                  value:
                    request_id: req-example
                    status: not_analyzed
                    mode: escalate
                    category: other
                    urgency: unassessed
                    urgency_reason: Analysis unavailable
                    summary: Manual review required
                    known_facts: []
                    missing_data: []
                    next_step: Operator verifies permissions and selects specialist
                    evidence: []
                    draft_reply: null
                    needs_human_review: true
                    warnings:
                    - model_unavailable
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    Unauthorized:
      description: Отсутствует или недействителен сервисный токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Malformed JSON syntax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Запрос превышает разрешённый размер
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableContent:
      description: JSON корректен, но значения не проходят ограничения контракта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Модель или утверждённая БЗ недоступна; вызывающая сторона использует
        ручной маршрут
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: ai
    HistoryMessage:
      type: object
      additionalProperties: false
      required:
      - speaker
      - text
      properties:
        speaker:
          type: string
          enum:
          - customer
          - operator
        text:
          type: string
          minLength: 1
          maxLength: 10000
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - ticket_ref
      - ticket_text
      - history
      - kb_version
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 100
        ticket_ref:
          type: string
          minLength: 1
          maxLength: 100
          description: Непрозрачный локальный идентификатор; не содержит PII
        ticket_text:
          type: string
          minLength: 1
          maxLength: 10000
        history:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/HistoryMessage'
        kb_version:
          type: string
          minLength: 1
          maxLength: 100
    Evidence:
      type: object
      additionalProperties: false
      required:
      - source_id
      - version
      - title
      - excerpt
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 500
        excerpt:
          type: string
          minLength: 1
          maxLength: 3000
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - status
      - mode
      - category
      - urgency
      - urgency_reason
      - summary
      - known_facts
      - missing_data
      - next_step
      - evidence
      - draft_reply
      - needs_human_review
      - warnings
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - proposed
          - not_analyzed
        mode:
          type: string
          enum:
          - answer
          - clarify
          - escalate
        category:
          type: string
          enum:
          - access
          - payment
          - settings
          - integrations
          - product_error
          - other
        urgency:
          type: string
          enum:
          - unassessed
          - low
          - medium
          - high
          - critical
        urgency_reason:
          type: string
          minLength: 1
          maxLength: 1000
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        known_facts:
          type: array
          maxItems: 30
          items:
            type: string
        missing_data:
          type: array
          maxItems: 30
          items:
            type: string
        next_step:
          type: string
          minLength: 1
          maxLength: 2000
        evidence:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Evidence'
        draft_reply:
          type:
          - string
          - 'null'
          maxLength: 4000
        needs_human_review:
          type: boolean
          const: true
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
      allOf:
      - if:
          properties:
            mode:
              const: answer
          required:
          - mode
        then:
          properties:
            status:
              const: proposed
            evidence:
              minItems: 1
            draft_reply:
              type: string
              minLength: 1
      - if:
          properties:
            mode:
              const: clarify
          required:
          - mode
        then:
          properties:
            status:
              const: proposed
            missing_data:
              minItems: 1
            draft_reply:
              type: string
              minLength: 1
      - if:
          properties:
            mode:
              const: escalate
          required:
          - mode
        then:
          properties:
            draft_reply:
              type: 'null'
      - if:
          properties:
            status:
              const: not_analyzed
          required:
          - status
        then:
          properties:
            mode:
              const: escalate
            category:
              const: other
            urgency:
              const: unassessed
            known_facts:
              maxItems: 0
            evidence:
              maxItems: 0
            warnings:
              minItems: 1
            draft_reply:
              type: 'null'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - retryable
      properties:
        error:
          type: string
          enum:
          - invalid_json
          - invalid_input
          - input_too_large
          - unauthorized
          - model_unavailable
          - knowledge_base_unavailable
        message:
          type: string
        retryable:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: service-token
