name: LAB05 Quality evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [lab5-quality-testing]
    tags: ['lab5-quality-release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/evals/requirements.lock
      - name: Recheck saved evidence and regressions without API calls
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--require-tag "$GITHUB_REF_NAME")
          fi
          python tests/evals/run_lab5.py --output "$RUNNER_TEMP/quality-lab5" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab5-quality-evidence
          path: ${{ runner.temp }}/quality-lab5
          if-no-files-found: error
