name: LAB06 Demo release checks
on:
  push:
    branches: [lab6-quality]
    tags: ['lab6-quality-demo-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-technical-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Obtain immutable public test dependency from LAB05
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8f6d9bc0b9ec13ddf6ce6f147ab177258564a51c
          path: .lab6-runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/evals/requirements.lock
      - name: Check demo replay, input attacks, provider failure and old defect
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--require-tag "$GITHUB_REF_NAME")
          fi
          python tests/evals/lab6.py --output "$RUNNER_TEMP/lab6-preparation" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab6-demo-technical
          path: ${{ runner.temp }}/lab6-preparation/
          if-no-files-found: error

  full-quality-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Obtain immutable public test dependency from LAB05
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8f6d9bc0b9ec13ddf6ce6f147ab177258564a51c
          path: .lab6-runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/evals/requirements.lock
      - name: Check demo replay, input attacks, provider failure and old defect
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--require-tag "$GITHUB_REF_NAME")
          fi
          python tests/evals/lab6.py --require-targets --output "$RUNNER_TEMP/lab6-preparation" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab6-full-quality-targets
          path: ${{ runner.temp }}/lab6-preparation/
          if-no-files-found: error
