name: Quality LAB03 evals
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/evals/requirements.txt
      - run: python docs/quality/golden-dataset/validate.py
      - run: python -m unittest discover -s tests/evals -p 'test_*.py' -v
      - run: python tests/evals/run.py --mode replay
      - run: python tests/evals/run.py --mode baseline
      - run: python tests/evals/check_live.py
      - run: python tests/evals/check_iteration.py
      - run: python tests/evals/retrieval.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-eval-results
          path: tests/evals/evidence/*report.json
