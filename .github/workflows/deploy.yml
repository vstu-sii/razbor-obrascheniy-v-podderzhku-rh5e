name: LAB04 Build and production deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Compatible previously verified full commit SHA; empty deploys this revision'
        required: false
        type: string
permissions:
  contents: read
  checks: read
concurrency:
  group: lab04-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality-gates.yml
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      quota-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: synthetic_infra_only
          POSTGRES_DB: infra_audit
        ports: ['18522:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d infra_audit"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Concurrency and durable daily quotas on PostgreSQL
        env:
          INFRA_TEST_DATABASE_URL: postgresql://audit:synthetic_infra_only@127.0.0.1:18522/infra_audit
        run: python -m unittest discover -s tests -p test_infrastructure.py -v
      - name: Build exact revision and validate common configuration
        run: |
          docker build --build-arg APP_REVISION=${{ github.sha }} -t support-triage:${{ github.sha }} .
          docker compose -f compose.yml -f compose.staging.yml config --quiet
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: lab04-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require a compatible previously green rollback revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.rollback_sha || github.sha }}
        run: python ops/approved_release.py "$RELEASE_SHA"
      - name: Release a fixed SHA and verify its health revision
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          RELEASE_SHA: ${{ inputs.rollback_sha || github.sha }}
        run: python ops/release.py deploy --sha "$RELEASE_SHA"
