name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      # Preserve the original skeleton style gate; recorded cascade fixtures
      # retain their evaluated source and are verified by unittest and pytest.
      - run: ruff check app tests/test_api.py
      - run: ruff format --check app tests/test_api.py
      - run: python -m compileall app
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m pytest -q
      - run: python -m pip check
      - run: docker build -t ai-support-triage:ci .
