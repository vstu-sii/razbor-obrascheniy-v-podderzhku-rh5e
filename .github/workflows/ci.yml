name: LAB03 Delivery checks
on:
 pull_request:
 push:
  branches: [main, lab3-delivery-prototype]
permissions:
 contents: read
jobs:
 prototype:
  runs-on: ubuntu-latest
  timeout-minutes: 12
  steps:
   - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
   - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
     with:
      python-version: '3.12'
   - run: python -m pip install -r requirements.txt
   - run: python -m unittest discover -s tests -p test_delivery.py -v
   - name: Compose without env file or operator token
     shell: bash
     run: |
      unset DEMO_OPERATOR_TOKEN DATABASE_URL
      docker compose up -d --build --wait
      trap 'docker compose down --volumes' EXIT
      curl --fail --silent http://127.0.0.1:8000/health
