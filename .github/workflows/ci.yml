name: LAB03 event runtime
on:
  pull_request:
  push:
    branches: [main, lab3-delivery-prototype]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: synthetic_audit_only
          POSTGRES_DB: event_audit
        ports: ['18092:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d event_audit"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Same event scenarios on PostgreSQL
        env:
          EVENT_TEST_DATABASE_URL: postgresql://audit:synthetic_audit_only@127.0.0.1:18092/event_audit
        run: python -m unittest discover -s tests -p test_events.py -v
      - name: Start complete system with no env file
        shell: bash
        run: |
          unset DEMO_OPERATOR_TOKEN DATABASE_URL
          docker compose up -d --build --wait
          curl --fail --silent http://127.0.0.1:8000/health
      - name: Browser review and event polling
        shell: bash
        run: |
          npm ci
          google-chrome --version
          export DEMO_OPERATOR_TOKEN="$(docker compose exec -T app python -c "from backend.bootstrap import configure_database,operator_token; configure_database(); print(operator_token('/data'))")"
          echo "::add-mask::$DEMO_OPERATOR_TOKEN"
          export AUDIT_URL=http://127.0.0.1:8000 PLAYWRIGHT_CHANNEL=chrome
          npm run test:ui
      - name: Cleanup synthetic containers
        if: always()
        run: docker compose down --volumes
