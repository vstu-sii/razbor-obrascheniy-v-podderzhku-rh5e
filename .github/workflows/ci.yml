name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: python -m compileall app
      - run: python -m pytest -q --ignore=scripts/demo-seed
      - name: Verify the standalone LAB06 demo package
        if: ${{ hashFiles('scripts/demo-seed/requirements.lock') != '' }}
        run: |
          python -m venv "$RUNNER_TEMP/lab06-demo"
          demo_python="$RUNNER_TEMP/lab06-demo/bin/python"
          "$demo_python" -m pip install -r scripts/demo-seed/requirements.lock
          "$demo_python" -m unittest discover -s scripts/demo-seed -v
      - run: python -m pip check
      - run: docker build -t ai-support-triage:ci .
