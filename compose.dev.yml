name: lab02-delivery

x-stub: &stub
  build: ./services/stub
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  backend:
    <<: *stub
    environment:
      SERVICE_NAME: backend
      AI_URL: http://ai:8000
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    networks: [frontend, application]
    depends_on:
      ai: {condition: service_healthy}
      triage-store: {condition: service_healthy}
      helpdesk-adapter: {condition: service_healthy}
  ai:
    build: ./services/ai
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [application]
    depends_on:
      knowledge: {condition: service_healthy}
      llm-adapter: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  knowledge:
    <<: *stub
    environment: {SERVICE_NAME: knowledge}
    networks: [application, knowledge-data]
    depends_on:
      knowledge-db: {condition: service_healthy}
  triage-store:
    <<: *stub
    environment: {SERVICE_NAME: triage-store}
    networks: [application, triage-data]
    depends_on:
      triage-db: {condition: service_healthy}
  helpdesk-adapter:
    <<: *stub
    environment: {SERVICE_NAME: helpdesk-adapter}
    networks: [application]
  llm-adapter:
    <<: *stub
    environment: {SERVICE_NAME: llm-adapter}
    networks: [application]
  triage-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: triage
    networks: [triage-data]
    volumes:
      - triage_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-triage} -d triage"]
      interval: 5s
      timeout: 3s
      retries: 12
  knowledge-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: knowledge
    networks: [knowledge-data]
    volumes:
      - knowledge_db:/var/lib/postgresql/data
      - ./database/knowledge-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-triage} -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 12
  ui:
    image: nginx:1.27-alpine
    volumes: ["./frontend/prototype:/usr/share/nginx/html:ro"]
    ports: ["127.0.0.1:${UI_PORT:-8080}:80"]
    networks: [frontend]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  frontend: {}
  application: {internal: true}
  triage-data: {internal: true}
  knowledge-data: {internal: true}
volumes:
  triage_db: {}
  knowledge_db: {}
