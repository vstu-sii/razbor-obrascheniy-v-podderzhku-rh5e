apiVersion: 1
datasources:
- name: Prometheus
  uid: triage-prometheus
  type: prometheus
  url: http://prometheus:9090
  access: proxy
  isDefault: true
- name: Loki
  uid: triage-loki
  type: loki
  url: http://loki:3100
  access: proxy
  jsonData:
    derivedFields:
    - name: TraceID
      matcherRegex: '"trace_id": "([a-f0-9]{32})"'
      datasourceUid: triage-tempo
      url: $${__value.raw}
- name: Tempo
  uid: triage-tempo
  type: tempo
  url: http://tempo:3200
  access: proxy
  jsonData:
    nodeGraph:
      enabled: true
