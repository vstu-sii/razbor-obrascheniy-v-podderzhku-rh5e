global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: support-triage
  metrics_path: /metrics
  bearer_token_file: /run/secrets/metrics-token
  static_configs:
  - targets:
    - app:8000
